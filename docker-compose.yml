# Meta fetches story media over HTTPS, so this process needs a public origin.
# How you provide it is up to you — the bridge only ever needs to be told the
# resulting hostname, through PUBLIC_BASE_URL.
#
#   Cloudflare tunnel   docker compose --profile tunnel up -d
#   Your own proxy      docker compose up -d       (see BRIDGE_PORT below)
#
# Both modes read the same .env.

services:
  bridge:
    build: .
    image: share-stories
    restart: unless-stopped
    # Reaps zombies and forwards signals, so `docker stop` shuts down cleanly
    # instead of waiting out the timeout.
    init: true
    env_file: .env
    environment:
      # Must bind all interfaces: loopback is unreachable from another
      # container or from the host.
      MEDIA_SERVER_HOST: 0.0.0.0
      MEDIA_SERVER_PORT: 8080
      # The hostname your proxy or tunnel serves, e.g. https://stories.example.com
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL to the public hostname}
    volumes:
      # Telegram session, rotating Instagram token, dedupe database. Back it up.
      - ./data:/app/data
    ports:
      # Bound to loopback by default, so an external proxy on this host can
      # reach it while the internet cannot. Set BRIDGE_PORT to move it, or
      # drop this block entirely when using the tunnel profile.
      - '${BRIDGE_BIND:-127.0.0.1}:${BRIDGE_PORT:-8080}:8080'

    # Nothing is written outside the data volume.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Optional. Only starts with --profile tunnel.
  tunnel:
    profiles: ['tunnel']
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # A named tunnel: the token carries its identity and routing, so the
    # hostname survives restarts — unlike a quick tunnel.
    #
    # Defaulted rather than required, because compose interpolates every
    # service before it filters by profile: demanding it here would force a
    # Cloudflare token on people who front this with their own proxy.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      bridge:
        condition: service_healthy
