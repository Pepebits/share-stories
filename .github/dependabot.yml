version: 2

# The image is only rebuilt on a tag, so a CVE in a runtime dependency waits
# for the next release anyway: one monthly batch to review beats a trickle.
# Minor and patch updates share one pull request; a major gets its own, since
# it is the one that needs reading rather than a green build.
#
# Commits follow Conventional Commits; "chore" plus the scope Dependabot adds
# gives "chore(deps):" and "chore(deps-dev):".
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The plugin requires the parser at its own version, so updating one alone
      # fails to resolve (October 2026). Listed first: a dependency joins the
      # first group that matches it.
      typescript-eslint:
        patterns: ['@typescript-eslint/*']
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # Telegram's story surface is only lightly exercised by tests, so feed.ts rests on
    # shapes read from live responses. A major gets checked against the live API by hand,
    # not merged on a green build that never talks to Telegram.
    ignore:
      - dependency-name: teleproto
        update-types: ['version-update:semver-major']
      # The types must describe the Node that actually runs this (24: engines,
      # Dockerfile, CI). Newer majors would type-check APIs Node 24 lacks. Raise
      # them together with the runtime, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    # The Node major is pinned on purpose: package.json "engines" and the
    # final stage's copied binary both assume it. Bumping it is a release
    # decision, made together with those.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # The images docker-compose.yml runs next to the bridge (cloudflared). The
  # weekly image scan says when one cannot wait for this.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
