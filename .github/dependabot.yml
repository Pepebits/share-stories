version: 2

# One pull request per ecosystem per month, with every update in it. The
# image is only rebuilt on a tag, so a CVE in a runtime dependency waits for
# the next release anyway; one monthly batch to review beats a trickle.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ['*']
    # GramJS leaves the story surface untyped, so feed.ts rests on shapes read
    # from live responses. A major gets checked against the live API by hand,
    # not merged on a green build that never talks to Telegram.
    ignore:
      - dependency-name: telegram
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
