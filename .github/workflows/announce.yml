name: Announce release

# Run by hand (Actions → Announce release → Run workflow) to preview the
# message for an existing tag, or to send it to a test chat, without
# publishing anything. publish.yml calls the shared workflow directly after a
# real release; the message itself is built by Pepebits/release-announce.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to announce, e.g. v1.1.0
        type: string
        required: true
      chat:
        description: Where to send it
        type: choice
        options: [test, announcements]
        default: test
      dry_run:
        description: Only print the message, send nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  announce:
    uses: Pepebits/release-announce/.github/workflows/announce.yml@v1
    with:
      tag: ${{ inputs.tag }}
      chat: ${{ inputs.chat }}
      dry_run: ${{ inputs.dry_run }}
      notes_source: tag
      install_title: 🐳 Docker image
      install_command: docker pull ghcr.io/pepebits/share-stories:{version}
      buttons: >-
        [{"text": "📝 Notes", "url": "{repo_url}/releases/tag/{tag}"},
         {"text": "📦 Package", "url": "{repo_url}/pkgs/container/share-stories"}]
      footer: 🏷️ Also tagged {minor} and latest
    secrets: inherit
