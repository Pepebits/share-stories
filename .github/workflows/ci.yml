name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub-hosted runners only. A pull request from a fork executes whatever
# code it contains, and on a self-hosted runner that would mean executing it
# on our own machine; requiring approval does not help, since approving a
# malicious pull request runs it just the same.
#
# A newer push to the same ref makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Downloads pnpm's self-contained binary (version from package.json
      # "packageManager") and installs Node through it, so the runner's own
      # npm and corepack never enter the picture.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Install
        # Fails rather than rewriting the lockfile if package.json drifted.
        # Install scripts stay limited to pnpm.onlyBuiltDependencies.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Runtime dependencies only. Advisories in eslint and friends never reach
      # the deployed process, and blocking merges on them trains people to
      # ignore the check. Kept as its own job so a new advisory is visibly
      # distinct from a genuine test failure.
      - name: Audit runtime dependencies
        run: pnpm audit --prod

  # Builds the runtime image and scans it. Kept out of `verify` so a new CVE
  # in a base layer is visibly a different failure from a broken test.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: share-stories:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: share-stories:scan
          severity: HIGH,CRITICAL
          # Nothing can be done about a vulnerability with no fix available,
          # so failing on one would only train people to ignore this job.
          ignore-unfixed: true
          exit-code: '1'
          format: table
