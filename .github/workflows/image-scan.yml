name: Image scan

# The image is only rebuilt on a tag, so between releases nothing looks at the
# one people are actually pulling. New advisories against its Alpine packages,
# Node or runtime dependencies appear anyway. This scans the published `latest`
# weekly and, when a HIGH or CRITICAL finding has a fix, opens an issue (or
# comments on the open one): the cue to cut a patch release, which rebuilds the
# image with the fixes. A clean scan closes that issue again, so an open one
# always means a release is due. Dependabot stays monthly; this is what says a
# release cannot wait for it.
#
# The third-party images docker-compose.yml runs next to the bridge (the
# cloudflared tunnel) are scanned the same way, each with its own issue: they
# are not part of our image, so neither CI nor a release ever looks at them.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Read from docker-compose.yml rather than listed here, so a new service or
  # a Dependabot bump is scanned without touching this file.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.list.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Services with `build:` are our own image, already covered by the
      # published one. yq ships with the GitHub-hosted runners.
      - name: List the images to scan
        id: list
        run: |
          matrix=$(yq -o=json '.services' docker-compose.yml | jq -c '
            [{image: "ghcr.io/pepebits/share-stories:latest",
              title: "Published Docker image has fixable vulnerabilities",
              advice: "Merge any pending Dependabot pull requests, then cut a patch release: it rebuilds the image with the fixes."}]
            + [.[] | select(has("build") | not) | .image
               | {image: .,
                  title: "Third-party image \(split("@")[0] | split(":")[0]) has fixable vulnerabilities",
                  advice: "Bump it in docker-compose.yml to a release with the fixes (Dependabot proposes one monthly), and tell anyone running the compose file to pull it."}]
            | {include: .}')
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  scan:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      issues: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.images.outputs.matrix) }}

    env:
      IMAGE: ${{ matrix.image }}
      # The issue is found again by this title, both to comment on it and to
      # close it.
      TITLE: ${{ matrix.title }}
      ADVICE: ${{ matrix.advice }}

    steps:
      - name: Scan the image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy.txt

      # An empty report means the scan itself broke (registry, network), not
      # that the image is clean or dirty: fail loudly instead of filing noise.
      - name: Open or update the security issue
        if: steps.trivy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s trivy.txt ]; then echo "::error::The scan itself failed (no report)"; exit 1; fi
          {
            echo "The weekly scan of \`$IMAGE\` found HIGH/CRITICAL vulnerabilities that already have a fix."
            echo "$ADVICE"
            echo
            echo "Scan run: $RUN_URL"
            echo
            echo '```'
            head -c 60000 trivy.txt
            echo '```'
          } > body.md
          gh label create security --color B60205 --description 'Security' 2>/dev/null || true
          existing=$(gh issue list --state open --label security --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$TITLE" --label security --body-file body.md
          fi

      # The patch release, bump or rebuilt base fixed it: say so on the issue
      # and close it, rather than leave it open until someone notices.
      - name: Close the security issue once the image is clean
        if: steps.trivy.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --label security --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The scan of \`$IMAGE\` is clean again: $RUN_URL"
          fi
