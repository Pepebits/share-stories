name: Publish image

# Tag a release to publish:  git tag v1.0.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Lets GITHUB_TOKEN push to ghcr.io — no personal token needed.
  packages: write

jobs:
  # The CI workflow runs on pushes to main, not on tags, so without this a
  # tag on a commit that was never green — or never pushed to main — would
  # still publish an image.
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      # The tag names the image; package.json names what the process says it
      # is. A 1.2.0 image announcing itself as 1.1.0 is a debugging trap.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

  publish:
    needs: verify
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    env:
      # Docker Hub is optional. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in
      # the repository secrets to publish there as well as to ghcr.io; leave
      # them unset and every Docker Hub step is skipped.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v7

      # Cross-building arm64 on an x64 runner. Emulated, so it is slow — but a
      # single-arch image simply will not start on the other architecture.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/share-stories,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # v1.2.3 publishes 1.2.3, 1.2 and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A bill of materials and a signed record of how the image was
          # built. Free, and most of what a hardened base image sells.
          sbom: true
          provenance: mode=max

      # Keeps the Docker Hub overview in step with the repo instead of letting
      # it rot. Tolerated on failure: the API needs a token with
      # read/write/DELETE scope, and a read/write one is enough for pushing
      # images — no reason to fail a good release over the description.
      - name: Sync the Docker Hub overview
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/share-stories
          short-description: 'Reposts Telegram stories to Instagram via the official Content Publishing API'
          readme-filepath: ./docs/DOCKERHUB.md
