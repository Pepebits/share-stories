name: Publish image

# Tag a release to publish:  git tag v1.0.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Lets GITHUB_TOKEN push to ghcr.io — no personal token needed.
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Docker Hub is optional. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in
      # the repository secrets to publish there as well as to ghcr.io; leave
      # them unset and every Docker Hub step is skipped.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v7

      # Cross-building arm64 on an x64 runner. Emulated, so it is slow — but a
      # single-arch image simply will not start on the other architecture.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/share-stories,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # v1.2.3 publishes 1.2.3, 1.2 and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A bill of materials and a signed record of how the image was
          # built. Free, and most of what a hardened base image sells.
          sbom: true
          provenance: mode=max
