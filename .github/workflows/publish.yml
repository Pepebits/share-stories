name: Publish image

# Tag a release to publish:  git tag v1.0.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; the one job that pushes images asks for more below.
permissions:
  contents: read

jobs:
  # The CI workflow runs on pushes to main, not on tags, so without this a
  # tag on a commit that was never green would still publish an image. A tag
  # on a commit that is not in main's history is refused outright: anyone who
  # can push a tag could otherwise publish arbitrary code as a release.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # This job runs the project's devDependencies, so it gets a token that can
    # do nothing but read, and does not leave it in .git/config for them to find.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, so origin/main can be compared with the tagged commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@24
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Check the tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not in the history of main"
            exit 1
          fi

      # The tag names the image; package.json names what the process says it
      # is. A 1.1.0 image announcing itself as 1.0.0 is a debugging trap.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

  # The release's own image, scanned before anything is pushed. CI scans main
  # too, but this workflow does not wait for it, and a base layer can gain a
  # fixable CVE between that run and the tag: this is the last chance to catch
  # it before it ships. Same policy as CI: HIGH and CRITICAL with a fix only.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: share-stories:release-scan
          # The release cache, so the scanned layers are the ones that get pushed.
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: share-stories:release-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  publish:
    needs: [verify, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to ghcr.io — no personal token needed.
      packages: write

    env:
      # Docker Hub is optional. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in
      # the repository secrets to publish there as well as to ghcr.io; leave
      # them unset and every Docker Hub step is skipped.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cross-building arm64 on an x64 runner. Emulated, so it is slow — but a
      # single-arch image simply will not start on the other architecture.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/share-stories,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # v1.2.3 publishes 1.2.3, 1.2 and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Its own scope: CI also writes a BuildKit cache from main, and the
          # layers of a published image should never come from there.
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          # A bill of materials and a signed record of how the image was
          # built. Free, and most of what a hardened base image sells.
          sbom: true
          provenance: mode=max

      # Keeps the Docker Hub overview in step with the repo instead of letting
      # it rot. Tolerated on failure: the API needs a token with
      # read/write/DELETE scope, and a read/write one is enough for pushing
      # images — no reason to fail a good release over the description.
      - name: Sync the Docker Hub overview
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/share-stories
          short-description: 'Reposts Telegram stories to Instagram via the official Content Publishing API'
          readme-filepath: ./docs/DOCKERHUB.md

  # Announces the release on Telegram once the images are actually pullable.
  # The message is built by the shared Pepebits/release-announce workflow;
  # announce.yml has the same call for running it by hand. It follows `v1`, so
  # compatible improvements arrive without a bump here; it is given only the
  # three Telegram secrets, so a moved tag over there cannot reach
  # DOCKERHUB_TOKEN. Skipped when the secrets are not set (forks), and never
  # fails the run.
  announce:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: Pepebits/release-announce/.github/workflows/announce.yml@v1
    with:
      tag: ${{ github.ref_name }}
      notes_source: tag
      install_title: 🐳 Docker image
      install_command: docker pull ghcr.io/pepebits/share-stories:{version}
      buttons: >-
        [{"text": "📝 Notes", "url": "{repo_url}/releases/tag/{tag}"},
         {"text": "📦 Package", "url": "{repo_url}/pkgs/container/share-stories"}]
      footer: 🏷️ Also tagged {minor} and latest
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
